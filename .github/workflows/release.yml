name: Build latest release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish single EXE
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          dotnet publish src/TaskbarCat/TaskbarCat.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -o artifacts
          Move-Item artifacts/TaskbarCat.exe artifacts/TaskbarKatze.exe
          $hash = (Get-FileHash artifacts/TaskbarKatze.exe -Algorithm SHA256).Hash
          "$hash  TaskbarKatze.exe" | Set-Content artifacts/TaskbarKatze.exe.sha256 -Encoding ascii
          $version | Set-Content artifacts/version.txt -Encoding ascii

      - name: Update rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "Taskbar Cat – aktuelle Version" --notes "Automatisch erstellte aktuelle Windows-Version."
          }
          gh release upload latest artifacts/TaskbarKatze.exe artifacts/TaskbarKatze.exe.sha256 artifacts/version.txt --clobber

